name: Publish
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: npm-release

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: npm install -g npm@^11

      - run: npm publish

      - name: Create GitHub Release
        run: |
          V=$(node -p "require('./package.json').version")
          # Custom notes from conventional commits; fall back to GitHub's
          # PR-only auto notes if generation fails, so the release still ships.
          if ! pnpm release-notes "v$V" > release-notes.md || [ ! -s release-notes.md ]; then
            exec gh release create "v$V" --title "v$V" --generate-notes
          fi
          gh release create "v$V" --title "v$V" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
