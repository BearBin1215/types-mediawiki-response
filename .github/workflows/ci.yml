name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Full dev-toolchain gate, same as local `pnpm check`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check (format, lint, types, ext mechanism)
        run: pnpm run check
      - name: Build
        run: pnpm run build

  # Compile the types and run the consumer harness against each TypeScript version.
  ts-compat:
    name: ts ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ["5", "6", "7"]
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pin TypeScript ${{ matrix.typescript }}
        run: pnpm add -w -D typescript@${{ matrix.typescript }}
      - name: Typecheck + extension activation harness
        run: pnpm run typecheck && pnpm run check:ext
